name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: citycare_clinic_test_db
      JWT_SECRET: ci-only-test-secret-that-is-never-used-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_DEMO_USERS: "true"
      DEMO_DOCTOR_PASSWORD: doctor123
      DEMO_PATIENT_PASSWORD: patient123
      DEMO_ADMIN_PASSWORD: admin123
      DOCTOR_EMAIL: dr.meera@citycare.com
      PRESCRIPTION_AI_USE_GEMINI: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify bytecode compilation
        run: python -m compileall -q core common chatbot telegram_bot mcp_server cli scripts tests main.py

      - name: Verify backend imports
        run: |
          python -c "import main; print('Backend main import OK')"
          python -c "import mcp_server.server; print('MCP server import OK')"

      - name: Run Ruff linter
        run: ruff check core common chatbot telegram_bot mcp_server cli scripts tests main.py

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code

  frontend-quality:
    name: Frontend Verification & Bundle Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: indigo-glow-app-main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: indigo-glow-app-main/package-lock.json

      - name: Set up Python for audit scripts
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run client secret leak audit
        run: python ../scripts/audit_client_secrets.py
