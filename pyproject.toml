[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module import order when loading env or configuring sys.path
    "E712",  # boolean equality comparisons in ODMantic query expressions
]
